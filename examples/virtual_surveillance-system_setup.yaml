# Virtual surveillance/alarm system (no real hardware), composed of:
#   0) virtual_surveillance-system_setup.yaml (this file) - system setup:
#      devices, modules, extensions, log.
#   1) virtual_surveillance-task_defs_1-nested.yaml - task definitions,
#      inlined, no templates, no scripting. Includes 0).
#   2) virtual_surveillance-task_defs_2-tempated.yaml - task definitions,
#      dynamically created tasks factored into named task_specs: templates.
#      Includes 0).
#   3) virtual_surveillance-task_defs_3-coded.yaml - task definitions,
#      every condition/action written as expr:/script code. Includes 0).
#
# This file (0): device/extension setup only, no tasks: -- pick one of
# 1)/2)/3) to actually run the system.

heartbeat: 1s

log:
  - dest: stdout
    levels:
      default: INFO

# surveillance/armed is the arm/disarm control; hallway_motion/state and
# cellar_motion/state are the intrusion sensors; all_lights/state is an
# independent manual on/off override. Toggle these directly to exercise the
# tasks that watch them. lights.living_light/lights.kitchen_light/siren are
# the shared filler devices from
# examples/devices/virtual_demo_devices.yaml, standing in for the hallway
# light/porch light/siren this walkthrough's tasks actually act on.
devices:
  - id: surveillance
    module: virtual
    name: Surveillance control
    endpoints:
      # No `default:` here (unlike the other endpoints below): a seeded
      # default commits an initial change event at config-load time, which
      # would still be visible -- and spuriously fire this condition -- on
      # the Scheduler's very first tick (task pass runs before that tick's
      # own commit clears it). armed/motion are watched by a `changed`
      # condition, so they start truly unset instead.
      - key: armed
        writable: true
        type: int
        values: { 0: "disarmed", 1: "armed" }

  - id: hallway_motion
    module: virtual
    name: Hallway motion sensor
    endpoints:
      - key: state
        writable: true
        type: int
        values: { 0: "clear", 1: "detected" }

  - id: cellar_motion
    module: virtual
    name: Cellar motion sensor
    endpoints:
      - key: state
        writable: true
        type: int
        values: { 0: "clear", 1: "detected" }

  - id: alarm
    module: virtual
    name: Alarm active flag
    endpoints:
      - key: state
        writable: true
        type: int
        values: { 0: "clear", 1: "active" }
        default: 0

  - id: all_lights
    module: virtual
    name: All lights override
    endpoints:
      # No `default:` (see surveillance/hallway_motion above, same reason):
      # watched by a `changed` condition below.
      - key: state
        writable: true
        type: int
        values: { 0: "off", 1: "on" }

  # lights.living_light stands in for the hallway light, lights.kitchen_light
  # for the porch light, and siren for this house's siren -- see
  # examples/devices/virtual_demo_devices.yaml.
  - !include devices/virtual_demo_devices.yaml

  # Shared sun-position device -- see examples/devices/sun_zurich.yaml.
  - !include devices/sun_zurich.yaml

# Randomizes the hallway/porch lights and ends an alert mail (with an
# email-to-SMS gateway address alongside an ordinary mailbox) when an intrusion
# is detected.
extensions:
  mail_alert:
    house:
      smtp_host: "smtp.example.com"
      username: "alerts@example.com"
      password: "changeme"   # plain text -- see extensions/mail_alert/extension.yaml
      from: "alerts@example.com"
      to:
        - "someone@example.com"
        - "15555550123@sms.example.com"

  random_light:
    house:
      sun_device: "sun_zurich"
      lights:
        # lights.living_light (standing in for the hallway light) sets
        # neither windows/min_interval/probability_on of its own -- it
        # inherits extensions/random_light/extension.yaml's own default
        # windows (a fixed evening cutoff, sunset-relative start; a fixed
        # morning start, sunrise-relative end), demonstrating the
        # extension-default -> instance -> per-light cascade.
        - device: "lights.living_light.state"
          default: true
        # lights.kitchen_light (standing in for the porch light) overrides
        # all three per-light instead.
        - device: "lights.kitchen_light.state"
          windows:
            - { start: "20:00", end: "23:00" }
          min_interval: 25m
          probability_on: 0.3

  web_ui:
    home:
      host: 127.0.0.1
      port: 8080
      refresh_interval: 2s
      pages:
        - id: home
          title: Surveillance
          sections:
            - id: security
              title: Security
              collapsed: false
              selectors: ["surveillance/*", "alarm/*", "hallway_motion/*", "cellar_motion/*", "siren/*"]
            - id: lights
              title: Lights
              collapsed: false
              selectors: ["lights.living_light/*", "lights.kitchen_light/*", "all_lights/*"]

  # A live view of this whole system's scheduler/task queue and endpoint
  # state, alongside web_ui above -- see examples/debug_portal_system.yaml
  # for a narrower walkthrough.
  debug_portal:
    debug:
      port: 8081
      # host: 127.0.0.1   -- already the default (loopback only)
      # selectors: ["*"]  -- already the default (every endpoint)
