# Shared device list: a sample of MeteoSwiss automatic weather stations
# (one per city). See the full list at
# https://data.geo.admin.ch/ch.meteoschweiz.messwerte-aktuell/info/VQHA80_en.txt
# and swap in whichever stations you actually want to track.
#
# Holds its devices under `devices:`; a consuming config splices them
# into its own `devices:` (or a host's `children:`) list with a full-line
# `!include devices/meteoswiss_stations.yaml#devices` at that list's item column -- see
# docs/configuration.md#splitting-configuration-across-files. No modules:/
# tasks:/intervals: here -- deliberately no update: on any device below
# either, since an including config is expected to set modules.meteoswiss.
# update itself (a device's own update: would otherwise take precedence
# over modules.meteoswiss.update and silently defeat that shared setting --
# see docs/configuration.md#modules-and-shared-configuration). All five
# devices poll the same published CSV (data_url is `scope: module` in
# devices/meteoswiss/module.yaml -- one shared value for every station, not
# per device), so an including config that also sets
# modules.meteoswiss.cache_time gets them coalesced into a single shared
# HTTP fetch per cache window.
devices:
  - id: meteo-bern
    module: meteoswiss
    name: Bern Weather
    station: BER

  - id: meteo-zurich
    module: meteoswiss
    name: Zurich Weather
    station: KLO

  - id: meteo-geneva
    module: meteoswiss
    name: Geneva Weather
    station: GVE

  - id: meteo-basel
    module: meteoswiss
    name: Basel Weather
    station: BAS

  - id: meteo-lugano
    module: meteoswiss
    name: Lugano Weather
    station: LUG
