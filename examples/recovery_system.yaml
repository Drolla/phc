heartbeat: 1s

log:
  - dest: stdout
    levels:
      default: INFO

# lights.desk_lamp/thermostat are the shared filler devices from
# examples/devices/virtual_demo_devices.yaml -- this example is about crash
# recovery, not the virtual module, so it just needs a couple of writable
# devices to persist/restore, not a device-module walkthrough of its own
# (see examples/virtual_system.yaml for that).
devices:
  - !include devices/virtual_demo_devices.yaml

# Persists lights.desk_lamp/power and thermostat/setpoint to a small YAML
# file, restoring them automatically the next time PHC starts (e.g. after a
# crash) instead of falling back to their `default:` above.
#
# Try it: run this example, let the two "warm_up_*" tasks below turn the
# lamp on and raise the setpoint, then stop PHC abruptly (e.g. `kill -9`,
# to simulate a crash rather than a graceful shutdown) -- inspect
# state/recovery.yaml, then start PHC again and watch the startup log:
# both endpoints come back to what they were, not their `default:`.
extensions:
  recovery:
    critical_state:
      selectors: ["lights.desk_lamp/power", "thermostat/setpoint"]
      path: "state/recovery.yaml"

tasks:
  - tag: warm_up_lamp
    description: "Turn the lamp on shortly after startup"
    time: "+5s"
    action: { kind: set, device: "lights.desk_lamp.power", value: 1 }

  - tag: warm_up_thermostat
    description: "Raise the setpoint shortly after startup"
    time: "+5s"
    action: { kind: set, device: "thermostat.setpoint", value: 21.5 }
