heartbeat: 1s

log:
  - dest: stdout
    levels:
      default: INFO

intervals:
  weather: 10m

# All meteoswiss devices below poll the same published CSV (data_url is
# `scope: module` in devices/meteoswiss/module.yaml -- one shared value for
# every station, not per device) and share one update interval + cache_time
# via modules.meteoswiss below (update: weather is why none of the devices
# below need their own update: -- see common/meteoswiss_cache_params.yaml),
# so the five stations coalesce into a single shared HTTP fetch per cache
# window instead of five independent downloads.
modules: !include common/meteoswiss_cache_params.yaml

# Station codes below are a sample of MeteoSwiss automatic weather stations
# (one per city); see the full list at
# https://data.geo.admin.ch/ch.meteoschweiz.messwerte-aktuell/info/VQHA80_en.txt
# and swap in whichever stations you actually want to track.
devices:
  - !include common/meteo_bern_device.yaml

  - id: meteo-zurich
    module: meteoswiss
    name: Zurich Weather
    params:
      station: KLO

  - id: meteo-geneva
    module: meteoswiss
    name: Geneva Weather
    params:
      station: GVE

  - id: meteo-basel
    module: meteoswiss
    name: Basel Weather
    params:
      station: BAS

  - id: meteo-lugano
    module: meteoswiss
    name: Lugano Weather
    params:
      station: LUG

tasks:
  - tag: report_bern
    description: "Log whenever the Bern temperature reading changes"
    condition: { device: "meteo-bern.temperature", changed: true }
    action: { kind: log, device: "meteo-bern", message: "meteo-bern changed to {state}" }

  - tag: report_zurich
    description: "Log whenever the Zurich temperature reading changes"
    condition: { device: "meteo-zurich.temperature", changed: true }
    action: { kind: log, device: "meteo-zurich", message: "meteo-zurich changed to {state}" }

  - tag: report_geneva
    description: "Log whenever the Geneva temperature reading changes"
    condition: { device: "meteo-geneva.temperature", changed: true }
    action: { kind: log, device: "meteo-geneva", message: "meteo-geneva changed to {state}" }

  - tag: report_basel
    description: "Log whenever the Basel temperature reading changes"
    condition: { device: "meteo-basel.temperature", changed: true }
    action: { kind: log, device: "meteo-basel", message: "meteo-basel changed to {state}" }

  - tag: report_lugano
    description: "Log whenever the Lugano temperature reading changes"
    condition: { device: "meteo-lugano.temperature", changed: true }
    action: { kind: log, device: "meteo-lugano", message: "meteo-lugano changed to {state}" }
