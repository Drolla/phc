heartbeat: 1s

log:
  - dest: stdout
    levels:
      default: INFO

intervals:
  weather: 10m

# All meteoswiss devices below poll the same published CSV (data_url is
# `scope: module` in devices/meteoswiss/module.yaml -- one shared value for
# every station, not per device) and share one update interval + cache_time
# via modules.meteoswiss below (update: weather is why none of the devices
# below need their own update:), so the five stations coalesce into a
# single shared HTTP fetch per cache window instead of five independent
# downloads.
modules:
  meteoswiss:
    update: weather
    cache_time: 5m

# The shared station list from examples/devices/meteoswiss_stations.yaml --
# see that file for the full list of MeteoSwiss automatic weather stations
# to swap in instead.
devices:
  - !include devices/meteoswiss_stations.yaml

# min_interval: 1m on every task below caps how often it can fire -- a
# no-op in practice at this module's own 10-minute poll cadence, but
# guards against a shorter update: later without silently losing the cap
# (see docs/configuration.md#min_interval--retrigger-cooldown).
tasks:
  - tag: report_bern
    description: "Log the Bern temperature reading, at most once a minute"
    condition: { device: "meteo-bern.temperature", changed: true }
    min_interval: 1m
    action: { kind: log, device: "meteo-bern", message: "meteo-bern changed to {state}" }

  - tag: report_zurich
    description: "Log the Zurich temperature reading, at most once a minute"
    condition: { device: "meteo-zurich.temperature", changed: true }
    min_interval: 1m
    action: { kind: log, device: "meteo-zurich", message: "meteo-zurich changed to {state}" }

  - tag: report_geneva
    description: "Log the Geneva temperature reading, at most once a minute"
    condition: { device: "meteo-geneva.temperature", changed: true }
    min_interval: 1m
    action: { kind: log, device: "meteo-geneva", message: "meteo-geneva changed to {state}" }

  - tag: report_basel
    description: "Log the Basel temperature reading, at most once a minute"
    condition: { device: "meteo-basel.temperature", changed: true }
    min_interval: 1m
    action: { kind: log, device: "meteo-basel", message: "meteo-basel changed to {state}" }

  - tag: report_lugano
    description: "Log the Lugano temperature reading, at most once a minute"
    condition: { device: "meteo-lugano.temperature", changed: true }
    min_interval: 1m
    action: { kind: log, device: "meteo-lugano", message: "meteo-lugano changed to {state}" }
