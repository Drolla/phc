# Virtual surveillance/alarm system (no real hardware). This file (0) is
# system setup only, no tasks: -- pick one task-def variant to run it:
#   1) emulated_surveillance-task_defs_1-nested.yaml     -- inlined, no templates
#   2) emulated_surveillance-task_defs_2-tempated.yaml   -- task_specs: templates
#   3) emulated_surveillance-task_defs_3-coded.yaml      -- expr:/script code
# Each includes this file.

heartbeat: 1s

log:
  - dest: stdout
    levels:
      default: INFO

devices:
  - id: surveillance
    module: virtual
    name: Surveillance control
    endpoints:
      # No default: -- armed/motion are watched by `changed`, so they
      # start truly unset instead of firing a spurious event on load.
      - key: armed
        writable: true
        type: bool
        values: { false: "disarmed", true: "armed" }

  - id: hallway_motion
    module: emulated_device
    name: Hallway motion sensor
    endpoints:
      - key: state
        writable: false
        type: bool
        values: { false: "clear", true: "detected" }
        default: false
        simulate: { kind: toggle, on_probability: 0.05, auto_clear_after: 30s }

  - id: cellar_motion
    module: emulated_device
    name: Cellar motion sensor
    endpoints:
      - key: state
        writable: false
        type: bool
        values: { false: "clear", true: "detected" }
        default: false
        simulate: { kind: toggle, on_probability: 0.05, auto_clear_after: 30s }

  - id: alarm
    module: virtual
    name: Alarm active flag
    endpoints:
      - key: state
        writable: true
        type: bool
        values: { false: "clear", true: "active" }
        default: false

  - id: all_lights
    module: virtual
    name: All lights override
    endpoints:
      - key: state
        writable: true
        type: bool
        values: { false: "off", true: "on" }

  # Shared filler devices -- see examples/devices/emulated_demo_devices.yaml.
  - !include devices/emulated_demo_devices.yaml

  # Shared sun-position device -- see examples/devices/sun_zurich.yaml.
  - !include devices/sun_zurich.yaml

extensions:
  # smtp_host points at loopback with nothing listening, so the send
  # fails fast and is logged as a warning -- point it at a real SMTP
  # server to actually receive the alert.
  mail_alert:
    house:
      smtp_host: "127.0.0.1"
      username: "alerts@example.com"
      password: "changeme"   # plain text -- see extensions/mail_alert/extension.yaml
      from: "alerts@example.com"
      to:
        - "someone@example.com"
        - "15555550123@sms.example.com"

  random_light:
    house:
      sun_device: "sun_zurich"
      lights:
        - device: "lights.living_light.state"
          probability_on: 0.1
          default: true
        - device: "lights.porch_light.state"
          windows:
            - { start: "20:00", end: "23:00" }
          min_interval: 25m
          probability_on: 0.3
        - device: "lights.kitchen_light.state"
          windows:
            - { start: "sunset-30m", end: "22:30" }
          min_interval: 12m
          probability_on: 0.5
        - device: "lights.desk_lamp.power"
          windows:
            - { start: "19:30", end: "23:30" }
          min_interval: 20m
          probability_on: 0.3

  web_ui:
    home:
      port: 8080
      refresh_interval: 2s
      pages:
        - id: home
          title: Surveillance
          sections:
            - id: security
              title: Security
              collapsed: false
              selectors: ["surveillance/*", "alarm/*", "hallway_motion/*", "cellar_motion/*", "siren/*"]
            - id: lights
              title: Lights
              collapsed: false
              selectors: ["lights.living_light/*", "lights.porch_light/*", "lights.kitchen_light/*",
                          "lights.desk_lamp/*", "all_lights/*"]

  debug_portal:
    debug:
      port: 8081
