# Fusion 18 / examples: connection params for one Razberry/zWay controller.
# Every device using this shares one cached batched status request per
# cache_time -- see devices/zway/module.yaml. Devices on a different
# physical controller should NOT include this file: they need their own
# base_url and would otherwise be silently, incorrectly assumed to share
# one controller's batched fetch.
base_url: http://192.168.1.21:8083
user: admin
password: admin
cache_time: 30s
