heartbeat: 1s

log:
  - dest: stdout
    levels:
      default: INFO
  - dest: zway_warn_err.log
    levels:
      default: WARNING

intervals:
  zwave: 1s
  zwave_meteo: 5m

# Devices sharing url/token share one WebSocket connection to the
# controller. No helper script is needed on the controller -- just an API
# token, issued in its user profile.
modules:
  zway:
    update: zwave
    url: !placeholder <URL>          # e.g. ws://192.168.1.21:8083
    token: !placeholder <Token>      # e.g. "12345.../abcdef-..."

devices:
  - !include devices/zway_devices.yaml

tasks:
  - tag: motion_light
    description: "Turn the corridor light on whenever motion is detected"
    condition: { device: "sensors_indoor.motion", changed: true, value: true }
    action:
      kind: set
      device: "lights.corridor"
      value: true

  # min_interval: 1m caps how often each reading is logged.
  - tag: report_indoor_temperature
    description: "Log the living room temperature, at most once a minute"
    condition: { device: "sensors_indoor.living_temp", changed: true }
    min_interval: 1m
    action:
      kind: log
      device: "sensors_indoor.living_temp"
      message: "living room temperature changed to {text}"

  - tag: report_outdoor_temperature
    description: "Log the weather station's temperature reading, at most once a minute"
    condition: { device: "weather_station.temp", changed: true }
    min_interval: 1m
    action: { kind: log, device: "weather_station.temp", message: "outdoor temperature changed to {text}" }

  # One-shot handshake: reset to "clear" so the next badge scan is a fresh
  # transition. See docs/zway.md's "Tag Readers" section.
  - tag: tag_reader_event
    description: "Log each badge scan and reset the tag reader's handshake"
    condition:
      refs: { event: "tag_reader.state" }
      expr: "event.changed and event.state in ('open', 'close')"
    actions:
      - kind: log
        device: "tag_reader.state"
        message: "tag reader event: {text}"
      - kind: set
        device: "tag_reader.state"
        value: "clear"
