heartbeat: 1s

log:
  - dest: stdout
    levels:
      default: INFO
      # Trace condition.expr/kind:script compilation and evaluation
      # (source, referenced paths, namespace, result) -- see
      # core/scripting.py.
      scripting: DEBUG

# Mirrors a previous Tcl-based home automation system's surveillance job
# set: arming/disarming toggles a control device (in real use, driven by a
# tag reader or a UI switch -- here, toggle surveillance.armed directly to
# exercise it); while armed, motion raises the alarm (at most once every 5
# minutes) and schedules timed follow-ups; disarming clears the siren/lights
# and cancels any pending follow-ups. See condition.expr/refs, kind: script,
# min_interval, and kind: kill_task.
devices:
  - id: surveillance
    module: virtual
    name: Surveillance control
    update: 2s
    endpoints:
      # No `default:` here (unlike the other endpoints below): a seeded
      # default commits an initial change event at config-load time, which
      # would still be visible -- and spuriously fire this condition -- on
      # the Scheduler's very first tick (task pass runs before that tick's
      # own commit clears it). armed/motion are watched by a `changed`
      # condition, so they start truly unset instead.
      - key: armed
        writable: true
        type: int
        values: { 0: "disarmed", 1: "armed" }

  - id: hallway_motion
    module: virtual
    name: Hallway motion sensor
    update: 2s
    endpoints:
      - key: state
        writable: true
        type: int
        values: { 0: "clear", 1: "detected" }

  - id: siren
    module: virtual
    name: Siren
    update: 2s
    endpoints:
      - key: state
        writable: true
        type: int
        values: { 0: "off", 1: "on" }
        default: 0

  - id: hallway_light
    module: virtual
    name: Hallway light
    update: 2s
    endpoints:
      - key: state
        writable: true
        type: int
        values: { 0: "off", 1: "on" }
        default: 0

  - id: porch_light
    module: virtual
    name: Porch light
    update: 2s
    endpoints:
      - key: state
        writable: true
        type: int
        values: { 0: "off", 1: "on" }
        default: 0

  - id: alarm
    module: virtual
    name: Alarm active flag
    update: 2s
    endpoints:
      - key: state
        writable: true
        type: int
        values: { 0: "clear", 1: "active" }
        default: 0

  - id: sun_zurich
    module: sun
    name: Sun (Zurich)
    update: 1h
    latitude: 47.3769
    longitude: 8.5417
    timezone: Europe/Zurich

# Randomizes the hallway/porch lights while armed (enable_ref) and not
# alarmed (pause_ref) -- see extensions/random_light. Sends an alert mail
# (with an email-to-SMS gateway address alongside an ordinary mailbox) when
# an intrusion is detected -- see extensions/mail_alert.
extensions:
  mail_alert:
    house:
      smtp_host: "smtp.example.com"
      username: "alerts@example.com"
      password: "changeme"   # plain text -- see extensions/mail_alert/extension.yaml
      from: "alerts@example.com"
      to:
        - "someone@example.com"
        - "15555550123@sms.example.com"

  random_light:
    house:
      enable_ref: "surveillance.armed"
      pause_ref: "alarm.state"
      sun_device: "sun_zurich"
      lights:
        # hallway_light sets neither windows/min_interval/probability_on of
        # its own -- it inherits extensions/random_light/extension.yaml's
        # own default windows (a fixed evening cutoff, sunset-relative
        # start; a fixed morning start, sunrise-relative end), demonstrating
        # the extension-default -> instance -> per-light cascade.
        - device: "hallway_light.state"
          default: true
        # porch_light overrides all three per-light instead.
        - device: "porch_light.state"
          windows:
            - { start: "20:00", end: "23:00" }
          min_interval: 25m
          probability_on: 0.3

tasks:
  - tag: surveillance_enable
    description: "Arming resets the alarm flag and forces lights off before random control takes over"
    condition:
      refs: { armed: "surveillance.armed" }
      expr: "armed.changed and armed.state == 1"
    actions:
      - kind: script
        code: |
          log('surveillance enabled')
          set_state('alarm.state', 0)
      - kind: random_light
        instance: "random_light.house"
        force: 0

  - tag: surveillance_disable
    description: "Disarming clears the siren/lights and cancels pending follow-ups"
    condition:
      # No refs: here (unlike surveillance_enable, above) -- state()/
      # changed() take the "device.endpoint" ref inline, as an alternative
      # to binding it to a short name first.
      expr: "changed('surveillance.armed') and state('surveillance.armed') == 0"
    actions:
      - kind: script
        code: |
          log('surveillance disabled')
          set_state('siren.state', 0)
          set_state('hallway_light.state', 0)
          set_state('alarm.state', 0)
          kill_task('surv_*')
      - kind: random_light
        instance: "random_light.house"
        force: 0

  - tag: surveillance_random_light
    description: "While armed and not alarmed, randomize the hallway/porch lights"
    time: +5s
    repeat: 1m
    action: { kind: random_light, instance: "random_light.house" }

  - tag: surveillance_intrusion
    description: "Motion while armed raises the alarm, at most once per 5 minutes"
    condition:
      refs: { armed: "surveillance.armed", motion: "hallway_motion.state" }
      expr: "armed.state == 1 and motion.changed and motion.state == 1"
    min_interval: 5m
    actions:
      - kind: script
        code: |
          log('intrusion detected')
          set_state('alarm.state', 1)
          set_state('siren.state', 1)
          create_task({
              'tag': 'surv_alert_log',
              'time': '+2s',
              'action': { 'kind': 'log', 'device': 'alarm.state', 'message': 'alert: intrusion detected' },
          })
          create_task({
              'tag': 'surv_siren_off',
              'time': '+3m',
              'action': { 'kind': 'set', 'device': 'siren.state', 'value': 0 },
          })
          create_task({
              'tag': 'surv_light_off',
              'time': '+45m',
              'actions': [
                  { 'kind': 'set', 'device': 'hallway_light.state', 'value': 0 },
                  { 'kind': 'set', 'device': 'alarm.state', 'value': 0 },
                  { 'kind': 'random_light', 'instance': 'random_light.house', 'force': 0 },
              ],
          })
      - kind: random_light
        instance: "random_light.house"
        force: 1
      - kind: mail_alert
        instance: "mail_alert.house"
        title: "Surveillance - Intrusion Alert"
        message: "Motion detected while armed"
