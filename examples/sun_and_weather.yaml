heartbeat: 1s

log:
  - dest: stdout
    levels:
      default: INFO

intervals:
  weather: 10m

# None of the modules below need any real or virtual hardware: sun is pure
# local computation (latitude/longitude + the system clock), open_meteo and
# meteoswiss are plain HTTP calls to free public APIs.

# All meteoswiss devices below poll the same published CSV (data_url is
# `scope: module` in devices/meteoswiss/module.yaml -- one shared value for
# every station, not per device); update/cache_time are shared too, via
# modules.meteoswiss below.
modules:
  meteoswiss:
    update: weather
    cache_time: 5m

# sun_zurich is the shared sun-position device (examples/devices/
# sun_zurich.yaml); meteo-bern (used by report_weather below, alongside
# four sibling stations from examples/devices/meteoswiss_stations.yaml) is
# the shared MeteoSwiss station list. zurich-weather stays local -- it's
# this example's own open_meteo device, demonstrating that module
# specifically. sun and open_meteo take latitude/longitude directly on the
# device, so swap in whatever location you actually want to track.
devices:
  - !include devices/sun_zurich.yaml
  - !include devices/meteoswiss_stations.yaml

  - id: zurich-weather
    module: open_meteo
    name: Zurich Weather
    update: weather
    latitude: 47.3769
    longitude: 8.5417

tasks:
  - tag: report_sunset
    description: "Log whenever today's sunset time is (re-)computed"
    condition: { device: "sun_zurich.sunset", changed: true }
    action: { kind: log, device: "sun_zurich", message: "sunset today is at {state}" }

  - tag: report_daylight
    description: "Log whenever daylight starts or ends"
    condition: { device: "sun_zurich.is_daylight", changed: true }
    action: { kind: log, device: "sun_zurich", message: "is_daylight changed to {state}" }

  # min_interval: 1m caps how often a temperature reading is logged, in
  # case its update: is ever shortened -- unlike sunset/daylight above,
  # which change at most a couple times a day and need no cap.
  - tag: report_temperature
    description: "Log the Zurich temperature reading, at most once a minute"
    condition: { device: "zurich-weather.temperature", changed: true }
    min_interval: 1m
    action: { kind: log, device: "zurich-weather", message: "zurich-weather temperature changed to {state}" }

  - tag: report_weather
    description: "Log the Bern temperature reading, at most once a minute"
    condition: { device: "meteo-bern.temperature", changed: true }
    min_interval: 1m
    action: { kind: log, device: "meteo-bern", message: "meteo-bern changed to {state}" }
