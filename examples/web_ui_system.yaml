# Demonstrates extensions/web_ui: run with
#   python -m phc --config examples/web_ui_system.yaml
# then open http://127.0.0.1:8080/ in a browser.
#
# Two pages, exercising every inferred widget kind plus a kind: graph panel:
#   - "Home": two sections -- "Lights" (open by default: a bool toggle and
#     an int slider with min/max) and "Fan" (folded by default: a
#     values-mapped dropdown).
#   - "Sensors": a real read-only devices/sun endpoint, rendered as a
#     live-updating label, plus a "History" section charting desk_lamp's
#     brightness and the sun's elevation over time (see the logdb instance
#     and log_db task below, which is what actually feeds it).

heartbeat: 1s

log:
  - dest: stdout
    levels:
      default: INFO
      web_ui: DEBUG

# lights.kitchen_light/lights.desk_lamp/fan are the shared filler devices
# from examples/devices/virtual_demo_devices.yaml (kitchen_light is
# bool-typed, specifically to exercise the toggle widget below); sun_zurich
# is examples/devices/sun_zurich.yaml. This example is about the web UI,
# not any one device module, so it just needs a few devices to render
# widgets for.
devices:
  - !include devices/virtual_demo_devices.yaml
  - !include devices/sun_zurich.yaml

extensions:
  # Feeds the "History" graph panel below -- see the log_db task at the
  # bottom of this file for what actually samples it.
  logdb:
    demo_log:
      selectors: ["lights.desk_lamp/brightness", "sun_zurich/elevation"]
      csv_path: "logs/web_ui_demo_log.csv"
      max_records: 5000

  web_ui:
    demo:
      host: 127.0.0.1
      port: 8080
      refresh_interval: 2s
      pages:
        - id: home
          title: Home
          sections:
            - id: lights
              title: Lights
              collapsed: false
              selectors: ["lights.kitchen_light/*", "lights.desk_lamp/*"]
            - id: fan
              title: Fan
              collapsed: true
              selectors: ["fan/*"]
        - id: sensors
          title: Sensors
          sections:
            - id: sun
              title: Sun
              collapsed: false
              selectors: ["sun_zurich/elevation"]
            - id: history
              title: History
              collapsed: false
              panels:
                - kind: graph
                  id: demo_history
                  logdb_instance: "logdb.demo_log"
                  selectors: ["lights.desk_lamp/brightness", "sun_zurich/elevation"]
                  title: "Desk Lamp Brightness & Sun Elevation"
                  window: 1h
                  decimation:
                    - older_than: 25h
                      factor: 3
                    - older_than: 8D
                      factor: 8

tasks:
  - tag: log_demo
    description: "Sample lights.desk_lamp/brightness and sun_zurich/elevation for the History graph panel"
    time: +2s
    repeat: 10s
    action: { kind: log_db, instance: "logdb.demo_log" }
