heartbeat: 1s

log:
  - dest: stdout
    levels:
      default: INFO

intervals:
  radon: 1m

# Both sensor units below share one WavePlus Bridge
# (https://github.com/Drolla/WavePlus_Bridge) at the same base_url, so their
# HTTP fetches automatically coalesce into a single shared request per
# cache_time window (see devices/waveplus_bridge/device.py's response
# cache, keyed by base_url) -- the same "shared fetch" pattern as
# examples/meteo_multi_city.yaml's meteoswiss stations, just per-bridge
# instead of a single global URL. Set cache_time to the same value on every
# device behind one bridge to keep them sharing one fetch.
devices:
  - id: cellar_office
    module: waveplus_bridge
    name: Cellar Office Air Quality
    update: radon
    base_url: !placeholder <URL>
    sensor_id: cellar_office
    cache_time: 60s
    data_validity_time: 5m

  - id: cellar_room
    module: waveplus_bridge
    name: Cellar Room Air Quality
    update: radon
    base_url: !placeholder <URL>
    sensor_id: cellar_room
    cache_time: 60s
    data_validity_time: 5m

tasks:
  - tag: report_cellar_office_radon
    description: "Log whenever the cellar office's short-term radon reading changes"
    condition: { device: "cellar_office.radon_st", changed: true }
    action: { kind: log, device: "cellar_office", message: "cellar_office radon_st changed to {state}" }

  - tag: report_cellar_room_radon
    description: "Log whenever the cellar room's short-term radon reading changes"
    condition: { device: "cellar_room.radon_st", changed: true }
    action: { kind: log, device: "cellar_room", message: "cellar_room radon_st changed to {state}" }
