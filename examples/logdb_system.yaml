heartbeat: 1s

log:
  - dest: stdout
    levels:
      default: INFO

intervals:
  fast: 3s

devices:
  # log_aggregation defaults to "max" -- a brief "on" pulse between two log
  # samples is still captured (see the logdb extension below).
  - id: living_light
    module: virtual
    name: Living Room Light
    update: fast
    endpoints:
      - key: state
        writable: true
        type: int
        values: { 0: "off", 1: "on" }
        default: 0

  - id: house
    module: host
    name: Whole House
    children:
      - id: kitchen
        module: host
        name: Kitchen
        children:
          - id: kitchen_light
            module: virtual
            update: 5s
            endpoints:
              - key: state
                writable: true
                type: int
                values: { 0: "off", 1: "on" }
                default: 0

      - id: hallway_light
        module: virtual
        update: fast
        endpoints:
          - key: state
            writable: true
            type: int
            default: 0

      - id: desk_lamp
        module: virtual
        update: fast
        endpoints:
          - key: power
            writable: true
            type: int
            values: { 0: "off", 1: "on" }
            default: 0
            log_aggregation: max
          - key: brightness
            writable: true
            type: int
            unit: "%"
            default: 0
            # brightness dips are as interesting as spikes, so track the
            # minimum seen between log samples instead of the default max.
            log_aggregation: min

# Two independently-scheduled logdb instances: a frequent one covering
# everything under house/ plus the living room light, and a slower one
# demonstrating a second, separately-configured CSV file.
extensions:
  logdb:
    house_log:
      selectors: ["house.*/*", "living_light/state"]
      csv_path: "logs/house_log.csv"
      max_records: 50000
      full_vector_interval: 50

    living_room_log:
      selectors: ["living_light/*"]
      csv_path: "logs/living_room_log.csv"
      max_records: 5000

  # A history chart for desk_lamp, backed by the house_log instance above
  # -- run this example and visit http://127.0.0.1:8080/ to see it. The
  # decimation tiers keep the response bounded as house_log accumulates
  # history: the newest 25h of samples are shown at full resolution,
  # 25h-8D-old samples are averaged in groups of 3, and anything older
  # than 8D in groups of 8 (see extensions/web_ui/extension.yaml's `pages`
  # parameter for the full kind: graph reference).
  web_ui:
    demo:
      host: "127.0.0.1"
      port: 8080
      pages:
        - id: home
          sections:
            - id: history
              title: Desk Lamp History
              panels:
                - kind: graph
                  id: desk_lamp_history
                  logdb_instance: "logdb.house_log"
                  selectors: ["house.desk_lamp/*"]
                  title: "Desk Lamp"
                  window: 6h
                  decimation:
                    - older_than: 25h
                      factor: 3
                    - older_than: 8D
                      factor: 8

tasks:
  - tag: blink
    description: "Toggle the light every 10s"
    time: +1s
    repeat: 10s
    action: { kind: toggle, device: "living_light.state" }

  - tag: log_house
    description: "Log the whole house's state every 30s"
    time: +5s
    repeat: 30s
    action: { kind: log_db, instance: "logdb.house_log" }

  - tag: log_living_room
    description: "Log just the living room light every 5s"
    time: +2s
    repeat: 5s
    action: { kind: log_db, instance: "logdb.living_room_log" }
