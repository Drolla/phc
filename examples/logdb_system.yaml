heartbeat: 1s

log:
  - dest: stdout
    levels:
      default: INFO

# lights.living_light/lights.desk_lamp/lights.kitchen_light/fan are the
# shared filler devices from examples/devices/virtual_demo_devices.yaml --
# this example is about logdb, not the virtual module, so it just needs a
# few devices to log, not a device-module walkthrough of its own (see
# examples/virtual_system.yaml for that). lights.desk_lamp/brightness's
# log_aggregation: min (see that file) demonstrates a logdb-specific
# feature.
devices:
  - !include devices/virtual_demo_devices.yaml

# Two independently-scheduled logdb instances: a frequent one covering
# every shared device, and a slower one demonstrating a second,
# separately-configured CSV file.
extensions:
  logdb:
    house_log:
      selectors: ["*/*"]
      csv_path: "logs/house_log.csv"
      max_records: 50000
      full_vector_interval: 50
      # log_aggregation defaults to "max" -- a brief "on" pulse between two
      # log samples is still captured. lights.desk_lamp/brightness
      # overrides this to "min" instead (see
      # devices/virtual_demo_devices.yaml), since brightness dips are as
      # interesting as spikes.

    living_room_log:
      selectors: ["lights.living_light/*"]
      csv_path: "logs/living_room_log.csv"
      max_records: 5000

  # A history chart for desk_lamp, backed by the house_log instance above
  # -- run this example and visit http://127.0.0.1:8080/ to see it. The
  # decimation tiers keep the response bounded as house_log accumulates
  # history: the newest 25h of samples are shown at full resolution,
  # 25h-8D-old samples are averaged in groups of 3, and anything older
  # than 8D in groups of 8 (see extensions/web_ui/extension.yaml's `pages`
  # parameter for the full kind: graph reference).
  web_ui:
    demo:
      host: "127.0.0.1"
      port: 8080
      pages:
        - id: home
          sections:
            - id: history
              title: Desk Lamp History
              panels:
                - kind: graph
                  id: desk_lamp_history
                  logdb_instance: "logdb.house_log"
                  selectors: ["lights.desk_lamp/*"]
                  title: "Desk Lamp"
                  window: 6h
                  decimation:
                    - older_than: 25h
                      factor: 3
                    - older_than: 8D
                      factor: 8

tasks:
  - tag: blink
    description: "Toggle the light every 10s"
    time: +1s
    repeat: 10s
    action: { kind: toggle, device: "lights.living_light.state" }

  - tag: log_house
    description: "Log every shared device's state every 30s"
    time: +5s
    repeat: 30s
    action: { kind: log_db, instance: "logdb.house_log" }

  - tag: log_living_room
    description: "Log just the living room light every 5s"
    time: +2s
    repeat: 5s
    action: { kind: log_db, instance: "logdb.living_room_log" }
