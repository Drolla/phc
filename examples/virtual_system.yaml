heartbeat: 1s

# log: is a list of destinations -- each with its own dest (stdout/stderr,
# or any other string is a file path resolved relative to this YAML's own
# directory, appended to) and levels (DEBUG/INFO/WARNING/ERROR). 'default'
# applies to any logger below that doesn't set its own level (a stream
# destination's 'default' can also be overridden from the command line
# with --log-level). The remaining keys are optional per-logger overrides,
# matching the dotted suffix of a "phc.<name>" logger (e.g. "scheduler",
# "tasks"); omit a logger to fall back to 'default'.
log:
  - dest: stdout
    levels:
      default: INFO
      scheduler: DEBUG
      # tasks: INFO

# lights.living_light/lights.kitchen_light/lights.desk_lamp/siren/... are
# the shared filler devices from examples/devices/virtual_demo_devices.yaml
# -- desk_lamp's brightness endpoint has a history: (see that file)
# demonstrating value history/fractile() below. See
# examples/logdb_system.yaml/full_house_system.yaml for the same shared
# devices used elsewhere.
devices:
  - !include devices/virtual_demo_devices.yaml

# Both extensions run side by side, each on its own port: web_ui at
# http://127.0.0.1:8080/ (widgets for the shared devices above) and
# debug_portal at http://127.0.0.1:8081/ (a live view of this system's
# scheduler/task queue and endpoint state) -- see
# examples/web_ui_system.yaml/examples/debug_portal_system.yaml for a
# narrower walkthrough of each on its own.
extensions:
  web_ui:
    demo:
      host: 127.0.0.1
      port: 8080
      refresh_interval: 2s
      pages:
        - id: home
          title: Home
          sections:
            - id: lights
              title: Lights
              collapsed: false
              selectors: ["lights.living_light/*", "lights.kitchen_light/*", "lights.desk_lamp/*"]
            - id: other
              title: Other
              collapsed: false
              selectors: ["thermostat/*", "siren/*", "fan/*"]

  debug_portal:
    debug:
      port: 8081
      # host: 127.0.0.1   -- already the default (loopback only)
      # selectors: ["*"]  -- already the default (every endpoint)

tasks:
  - tag: blink
    description: "Toggle the light every 5s"
    time: +1s
    repeat: 10s
    action: { kind: toggle, device: "lights.living_light.state" }

  - tag: report
    description: "Log whenever the light changes"
    condition: { device: "lights.living_light.state", changed: true }
    action: { kind: log, device: "lights.living_light.state", message: "living_light changed to {text}" }

  - tag: vary_brightness
    description: "Alternate the desk lamp's brightness, to give history: something to smooth"
    time: +1s
    repeat: 3s
    action:
      kind: set
      device: "lights.desk_lamp.brightness"
      expr: "0 if state('lights.desk_lamp.brightness') else 80"

  - tag: report_brightness_trend
    description: "Log the median of the last 5 brightness samples (see history:, above)"
    time: +2s
    repeat: 3s
    action:
      kind: script
      code: |
        log(f"desk_lamp brightness median: {median('lights.desk_lamp.brightness')}")
