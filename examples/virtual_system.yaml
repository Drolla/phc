heartbeat: 1s

# log: is a list of destinations -- each with its own dest (stdout/stderr,
# or any other string is a file path resolved relative to this YAML's own
# directory, appended to) and levels (DEBUG/INFO/WARNING/ERROR). 'default'
# applies to any logger below that doesn't set its own level (a stream
# destination's 'default' can also be overridden from the command line
# with --log-level). The remaining keys are optional per-logger overrides,
# matching the dotted suffix of a "phc.<name>" logger (e.g. "scheduler",
# "tasks"); omit a logger to fall back to 'default'.
log:
  - dest: stdout
    levels:
      default: INFO
      scheduler: DEBUG
      # tasks: INFO

intervals:
  fast: 3s

# A household-specific fixture (not a real product, so it doesn't belong in
# devices/virtual/module.yaml's own, generic module.yaml) can be defined
# once here and reused across devices via device_profile: -- see "Endpoint
# and device profiles" in README.md.
modules:
  virtual:
    device_profiles:
      siren:
        endpoints:
          - key: state
            writable: true
            type: int
            values: { 0: "off", 1: "on" }
            default: 0

devices:
  - !include common/living_light_device.yaml

  - id: house
    module: host
    name: Whole House
    children:
      - !include common/kitchen_device.yaml

      - id: desk_lamp
        module: virtual
        update: fast
        endpoints:
          - key: power
            writable: true
            type: int
            values: { 0: "off", 1: "on" }
            default: 0
          - key: brightness
            writable: true
            type: int
            unit: "%"
            default: 0
            # size: 5, no explicit interval -- samples once per poll (the
            # device's own `update: fast` = 3s), see "Value history &
            # fractiles" in docs/scripting.md.
            history: 5

      - id: siren_hallway
        module: virtual
        name: Hallway Siren
        device_profile: siren

      - id: siren_garage
        module: virtual
        name: Garage Siren
        device_profile: siren

tasks:
  - tag: blink
    description: "Toggle the light every 5s"
    time: +1s
    repeat: 10s
    action: { kind: toggle, device: "living_light.state" }

  - tag: report
    description: "Log whenever the light changes"
    condition: { device: "living_light.state", changed: true }
    action: { kind: log, device: "living_light.state", message: "living_light changed to {text}" }

  - tag: vary_brightness
    description: "Alternate the desk lamp's brightness, to give history: something to smooth"
    time: +1s
    repeat: 3s
    action:
      kind: set
      device: "house.desk_lamp.brightness"
      expr: "0 if state('house.desk_lamp.brightness') else 80"

  - tag: report_brightness_trend
    description: "Log the median of the last 5 brightness samples (see history:, above)"
    time: +2s
    repeat: 3s
    action:
      kind: script
      code: |
        log(f"desk_lamp brightness median: {median('house.desk_lamp.brightness')}")
