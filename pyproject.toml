[project]
name = "phc"
version = "0.1.0"
description = "YAML-configured home automation framework"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
    "aiohttp>=3.9",
    "astral>=3.2",
    "Jinja2>=3.1",
    "psutil>=5.9",
    "wmi>=1.5; platform_system=='Windows'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
phc = "phc.cli:main"

[tool.setuptools.packages.find]
include = ["phc*"]

# Device modules and extensions are a Python package PLUS a descriptor
# (module.yaml/extension.yaml) that is read at runtime, and the two web
# extensions serve Jinja templates and static assets from their own
# package directories. None of that is a .py file, so without this section
# a wheel contains the code and nothing else -- and every install that
# isn't `pip install -e .` fails at startup with "module 'sun' has no
# module.yaml", or serves an unstyled UI. Guarded by the
# wheel-install job in .github/workflows/tests.yml.
[tool.setuptools.package-data]
"phc.devices" = ["*/module.yaml"]
"phc.extensions" = ["*/extension.yaml", "*/templates/*", "*/static/*"]

[tool.pytest.ini_options]
# testpaths keeps a bare `pytest` from also walking examples/ and fusion18/.
testpaths = ["tests"]
# --strict-markers/--strict-config turn a typo'd marker or an unknown
# setting in this section into an error rather than a silently ignored
# line.
addopts = "--strict-markers --strict-config"
# The suite drives asyncio directly (asyncio.run / Scheduler's own loop)
# rather than through pytest-asyncio, so an "async def" test would be
# silently skipped as a non-awaited coroutine -- warn loudly instead.
filterwarnings = [
    "error::RuntimeWarning:_pytest.python",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
