description: >
  Emulates a real device's imperfect behavior: no hardware or network
  involved, but each read/write is delayed with natural variation (jitter)
  and occasional random spikes to simulate flakiness, like `virtual` with
  injected latency. All latency values are in seconds (fractions allowed,
  e.g. 0.2 for 200ms). An endpoint can also declare `simulate:` to generate
  its own reading each poll -- for something that stands in for a read-only
  real device (a sensor, a battery gauge) rather than an actuator a task
  writes to. Define whatever endpoints your device instance needs.

update: "5s"

parameters:
  - name: read_latency
    override: allowed
    default: 0.2
    description: >
      Normal delay (seconds, fractions allowed) before a read (receive)
      responds. The actual delay varies by +/- read_jitter around this
      value.
  - name: read_jitter
    override: allowed
    default: 0.3
    description: >
      Fractional variation around read_latency (e.g. 0.3 = ±30%).
  - name: read_spike_probability
    override: allowed
    default: 0.05
    description: Chance (0-1) that a given read spikes instead of using read_latency.
  - name: read_spike_latency
    override: allowed
    default: 3.0
    description: >
      Delay (seconds) used instead of read_latency when a read "spikes".
      Also varies by +/- read_spike_jitter around this value.
  - name: read_spike_jitter
    override: allowed
    default: 0.3
    description: >
      Fractional variation around read_spike_latency (same as read_jitter).
  - name: write_latency
    override: allowed
    default: 0.2
    description: >
      Normal delay (seconds, fractions allowed) before a write (transmit)
      responds. The actual delay varies by +/- write_jitter around this
      value.
  - name: write_jitter
    override: allowed
    default: 0.3
    description: >
      Fractional variation around write_latency (e.g. 0.3 = ±30%).
  - name: write_spike_probability
    override: allowed
    default: 0.05
    description: Chance (0-1) that a given write spikes instead of using write_latency.
  - name: write_spike_latency
    override: allowed
    default: 3.0
    description: >
      Delay (seconds) used instead of write_latency when a write
      "spikes". Also varies by +/- write_spike_jitter around this value.
  - name: write_spike_jitter
    override: allowed
    default: 0.3
    description: >
      Fractional variation around write_spike_latency (same as write_jitter).

endpoint_parameters:
  - name: simulate
    description: >
      Makes this endpoint generate its own reading each poll instead of
      (or in addition to) echoing writes -- independent of `writable:`.
      {kind: toggle, on_probability, auto_clear_after} for a bool
      endpoint, or {kind: drift, step} for a numeric one -- see
      device.py.

endpoints: []
