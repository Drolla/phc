description: >
  Virtual devices on a Z-Way (Razberry) controller, read and written over
  the ZAutomation WebSocket API. Nothing needs to be installed on the
  controller -- only a URL and an API token.

  Every endpoint names one Z-Way virtual device with `device:`, which is
  an fnmatch glob matched against both the device id and its title, e.g.
  "ZWayVDev_zway_20-1-37", "Rez: Light corridor" or "*living temp*". It
  must match exactly one device: matching none, or several, is a config
  error naming the candidates. Matching ignores case unless the endpoint
  sets `match_case: true` (unlike PHC's selector globs elsewhere, which
  are case-sensitive -- Z-Way titles are hand-written and inconsistently
  capitalised). Patterns are resolved to device ids once per connection;
  everything after that addresses the controller by id.

  Values are translated to PHC's own types: a binary device reports the
  strings "on"/"off" on the wire and appears here as a real bool, and an
  unreadable, empty or unrecognised level becomes None rather than a
  misleading value. Which commands a device accepts follows the
  deviceType the controller reports for it, since the controller itself
  answers 200 OK to commands that make no sense for the device.

  Devices sharing url+token share one WebSocket. State is kept current by
  the controller's own push events, so an endpoint is typically fresh
  within a tick of changing, with a periodic full re-read as a safety
  net. A controller that is unreachable is retried after 1s, 10s, 60s
  and then every 5 minutes; while it is down every endpoint reads None.

update: "1s"

parameters:
  - name: url
    override: required
    description: >
      WebSocket URL of the controller, e.g. "ws://192.168.1.21:8083".
      Typically set once for every device of this module under
      modules.zway rather than repeated per device -- devices sharing a
      url and token share a single connection.
  - name: token
    override: required
    description: >
      API token for the controller, as issued in its user profile
      ("<id>/<uuid>"). Keep it out of the config with !include or
      !placeholder.
  - name: request_timeout
    override: allowed
    default: "5s"
    description: >
      How long to wait for one reply. This is also what detects a bad
      token: the controller accepts the connection and then simply never
      answers.
  - name: resync_interval
    override: allowed
    default: "5m"
    description: >
      How often to re-read every device in full, as a safety net behind
      the push events (any value parse_duration accepts).

endpoint_parameters:
  - name: device
    description: >
      Which Z-Way virtual device this endpoint reads and writes: an
      fnmatch glob matched against both device id and title, which must
      match exactly one device.
  - name: match_case
    description: >
      Match `device` case-sensitively. Defaults to false.

endpoints: []

# How each deviceType the controller reports is translated and commanded.
# Read by device.py rather than by PHC's config loader, so a new device
# type is a change here and not in Python.
#
#   type:          PHC value type; a level that will not convert reads as None
#   writable:      false rejects writes locally, before they reach the wire
#   read:          wire level -> PHC value; anything unlisted reads as None
#   write:         PHC value -> command, for bool-ish writes
#   write_numeric: command template for a numeric write
#   refresh:       command that asks the controller to re-read the device
zway_types:
  switchBinary:
    type: bool
    writable: true
    read: { "on": true, "off": false }
    write: { true: "command/on", false: "command/off" }
    refresh: "command/update"
  switchMultilevel:
    # Note: "on" lands at 99 and "off" at 0, so a bool write to a dimmer
    # reads back as a number rather than as the bool that was written.
    type: int
    writable: true
    read: { "on": 99, "off": 0 }
    write: { true: "command/on", false: "command/off" }
    write_numeric: "command/exact?level={value}"
    refresh: "command/update"
  switchControl:
    type: bool
    writable: true
    read: { "on": true, "off": false }
    write: { true: "command/on", false: "command/off" }
    write_numeric: "command/exact?level={value}"
  thermostat:
    type: float
    writable: true
    write_numeric: "command/exact?level={value}"
  doorlock:
    type: bool
    writable: true
    read: { "open": true, "close": false, "on": true, "off": false }
    write: { true: "command/open", false: "command/close" }
  toggleButton:
    type: bool
    writable: true
    write: { true: "command/on", false: "command/on" }
  sensorBinary:
    type: bool
    writable: false
    read: { "on": true, "off": false }
    refresh: "command/update"
  sensorMultilevel:
    type: float
    writable: false
    refresh: "command/update"
  battery:
    type: int
    writable: false
    refresh: "command/update"

endpoint_profiles:
  switch:
    type: bool
    writable: true
    values: { false: "off", true: "on" }
  dimmer:
    type: int
    writable: true
    min: 0
    max: 99
  motion:
    type: bool
    values: { false: "clear", true: "triggered" }
  temperature:
    type: float
    unit: "°C"
  humidity:
    type: float
    unit: "%"
  luminosity:
    type: float
    unit: "%"
  pressure:
    type: float
    unit: kPa
  battery:
    type: int
    unit: "%"
