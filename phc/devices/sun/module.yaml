description: >
  Solar ephemeris for a location: today's sunrise/sunset/dawn/dusk/solar-noon
  and current solar elevation/azimuth. Pure computation via astral, no network.
  One device per location.

update: "1h"

parameters:
  - name: latitude
    override: required
    description: Observer latitude in decimal degrees (north positive).
  - name: longitude
    override: required
    description: Observer longitude in decimal degrees (east positive).
  - name: elevation
    override: allowed
    default: 0.0
    description: >
      Observer elevation above sea level, in meters. Shifts sunrise/sunset
      by a small amount (higher vantage points see the sun rise earlier and
      set later).
  - name: timezone
    override: allowed
    default: null
    description: >
      IANA timezone name (e.g. "Europe/Zurich") that the returned
      sunrise/sunset/dawn/dusk/solar_noon timestamps are computed against.
      Defaults to the system's local timezone.

endpoints:
  - key: sunrise
    readable: true
    writable: false
    type: datetime
    format: "%H:%M:%S"
    name: Sunrise
    description: Today's sunrise
  - key: sunset
    readable: true
    writable: false
    type: datetime
    format: "%H:%M:%S"
    name: Sunset
    description: Today's sunset
  - key: solar_noon
    readable: true
    writable: false
    type: datetime
    format: "%H:%M:%S"
    name: Solar Noon
    description: Today's solar noon (the sun's highest point today)
  - key: dawn
    readable: true
    writable: false
    type: datetime
    format: "%H:%M:%S"
    name: Civil Dawn
    description: Today's civil dawn (sun 6 degrees below the horizon)
  - key: dusk
    readable: true
    writable: false
    type: datetime
    format: "%H:%M:%S"
    name: Civil Dusk
    description: Today's civil dusk (sun 6 degrees below the horizon)
  - key: elevation
    readable: true
    writable: false
    type: float
    unit: "°"
    name: Solar Elevation
    description: Current solar elevation angle above the horizon (negative at night)
  - key: azimuth
    readable: true
    writable: false
    type: float
    unit: "°"
    name: Solar Azimuth
    description: Current solar azimuth angle clockwise from north
  - key: is_daylight
    readable: true
    writable: false
    type: bool
    name: Daylight
    description: True whenever the current solar elevation is above the horizon
