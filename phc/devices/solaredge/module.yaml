description: >
  Live power and energy readings from a SolarEdge photovoltaic site's
  cloud monitoring API. Requires an API key issued for the site in the
  SolarEdge monitoring portal -- treat it as a secret and guard any config
  file that contains a real one. One device per site.

update: "15m"

parameters:
  - name: api_key
    override: required
    description: >
      API key for this SolarEdge site, issued in the monitoring portal's
      admin/API access section.
  - name: site_id
    override: required
    description: The SolarEdge site's numeric id, as shown in the portal's URL.
  - name: powerdetails_window
    override: allowed
    default: "30m"
    description: >
      How far back to look for the most recent reported power reading
      (e.g. "30m", "1h"). SolarEdge posts power figures roughly every 15
      minutes and sometimes lags, so a window shorter than that risks
      finding nothing to report.
  - name: cache_time
    override: allowed
    default: "5m"
    description: >
      How long a fetched reading may be reused before it is fetched again
      (e.g. "5m", "30s" -- any value parse_duration accepts). Set to "0s"
      to always re-fetch.
  - name: request_timeout
    override: allowed
    default: "10s"
    description: >
      How long to wait for the SolarEdge API to answer before giving up on
      a poll (e.g. "10s", "500ms").

# Per-endpoint fields this module understands. `source` selects which API
# response an endpoint reads from: "overview" (a snapshot, dotted `field`
# path into it) or "power_details" (a trailing-window meter reading,
# picked out by `meter`). Declaring these here is what lets a config add
# an endpoint without touching code.
endpoint_parameters:
  - name: source
    description: Which API response this endpoint reads from, "overview" or "power_details".
  - name: field
    description: Dotted field path into the overview response (source "overview").
  - name: meter
    description: Which power_details meter this endpoint reads (source "power_details").

endpoints:
  - key: current_power
    readable: true
    writable: false
    type: float
    unit: "W"
    description: Current AC power output, watts
    source: overview
    field: currentPower.power
  - key: lifetime_energy
    readable: true
    writable: false
    type: float
    unit: "Wh"
    description: Total energy produced since installation, watt-hours
    source: overview
    field: lifeTimeData.energy
  - key: last_year_energy
    readable: true
    writable: false
    type: float
    unit: "Wh"
    description: Energy produced over the last year, watt-hours
    source: overview
    field: lastYearData.energy
  - key: last_month_energy
    readable: true
    writable: false
    type: float
    unit: "Wh"
    description: Energy produced over the last month, watt-hours
    source: overview
    field: lastMonthData.energy
  - key: last_day_energy
    readable: true
    writable: false
    type: float
    unit: "Wh"
    description: Energy produced over the last day, watt-hours
    source: overview
    field: lastDayData.energy
  - key: production
    readable: true
    writable: false
    type: float
    unit: "W"
    description: Power generated by the site's panels, watts
    source: power_details
    meter: Production
  - key: consumption
    readable: true
    writable: false
    type: float
    unit: "W"
    description: Total power consumed by the site, watts
    source: power_details
    meter: Consumption
  - key: self_consumption
    readable: true
    writable: false
    type: float
    unit: "W"
    description: Self-produced power consumed directly on site, watts
    source: power_details
    meter: SelfConsumption
  - key: feed_in
    readable: true
    writable: false
    type: float
    unit: "W"
    description: Self-produced power exported to the grid, watts
    source: power_details
    meter: FeedIn
  - key: purchased
    readable: true
    writable: false
    type: float
    unit: "W"
    description: Power purchased from the grid, watts
    source: power_details
    meter: Purchased
