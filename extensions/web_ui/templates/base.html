<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PHC — Home Control</title>
  <link rel="stylesheet" href="/static/pico.min.css">
  <link rel="stylesheet" href="/static/dygraph.min.css">
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/htmx.min.js"></script>
  <script src="/static/dygraph.min.js"></script>
  <script src="/static/graph.js" defer></script>
</head>
<body>
  <header class="container">
    <h1>Pylon Home Control</h1>
    {% if pages and pages|length > 1 %}
    <nav>
      <ul>
        {% for nav_page in pages %}
        <li><a href="/page/{{ nav_page.id }}"
               {% if page and nav_page.id == page.id %}aria-current="page"{% endif %}>{{ nav_page.title }}</a></li>
        {% endfor %}
      </ul>
    </nav>
    {% endif %}
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
