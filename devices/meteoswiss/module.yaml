description: >
  Live weather readings from a MeteoSwiss automatic weather station
  (temperature, humidity, pressure, wind, precipitation). One device per
  station -- set `station` to the station's abbreviation.

update: "10m"

parameters:
  - name: data_url
    override: none
    scope: module
    default: https://data.geo.admin.ch/ch.meteoschweiz.messwerte-aktuell/VQHA80.csv
    description: Source of the weather data. Not configurable.
  - name: station
    override: required
    description: >
      Which weather station to read from, e.g. "BER" for Bern. See the
      station list at
      https://data.geo.admin.ch/ch.meteoschweiz.messwerte-aktuell/info/VQHA80_en.txt
      for all available codes.
  - name: cache_time
    override: allowed
    scope: module
    default: "10m"
    description: >
      How long the shared CSV may be reused before re-fetching (e.g. "10m",
      "30s" -- any value parse_duration accepts). Scope: module (set once for
      all stations), controls how often the shared file is re-downloaded.
      Set to "0s" to always re-fetch.

endpoint_parameters:
  - name: column
    description: Which column of the shared CSV file this endpoint reads.

endpoints:
  - key: temperature
    readable: true
    writable: false
    type: float
    unit: "°C"
    description: Air temperature, degrees Celsius
    column: tre200s0
  - key: precipitation
    readable: true
    writable: false
    type: float
    unit: mm
    description: 10-minute precipitation, mm
    column: rre150z0
  - key: direction
    readable: true
    writable: false
    type: float
    unit: "°"
    description: Wind direction, degrees
    column: dkl010z0
  - key: speed
    readable: true
    writable: false
    type: float
    unit: m/s
    description: Wind speed, m/s
    column: fu3010z0
  - key: pressure
    readable: true
    writable: false
    type: float
    unit: hPa
    description: QNH pressure, hPa
    column: pp0qnhs0
  - key: humidity
    readable: true
    writable: false
    type: float
    unit: "%"
    description: Relative humidity, percent
    column: ure200s0
