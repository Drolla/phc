description: >
  Local system performance metrics: CPU load, memory, network/disk throughput,
  disk usage, CPU temperature, uptime. Cross-platform (Windows/Linux).
  Unavailable data reports null (e.g. CPU temperature without OpenHardwareMonitor
  on Windows).

update: "10s"

parameters:
  - name: disk_path
    override: allowed
    default: ""
    description: >
      Filesystem path/drive whose usage disk_usage_percent reports (e.g.
      "/" on Linux, "D:\\" on Windows). Empty (default) auto-selects "/" on
      Linux and the system drive on Windows.

endpoints:
  - key: cpu_percent
    readable: true
    writable: false
    type: float
    unit: "%"
    description: Overall CPU utilization, percent, averaged since the last poll.
  - key: memory_percent
    readable: true
    writable: false
    type: float
    unit: "%"
    description: Physical memory (RAM) currently in use, percent.
  - key: network_rx_rate
    readable: true
    writable: false
    type: float
    unit: "B/s"
    description: Inbound network throughput since last poll, bytes/second.
  - key: network_tx_rate
    readable: true
    writable: false
    type: float
    unit: "B/s"
    description: Outbound network throughput since last poll, bytes/second.
  - key: disk_usage_percent
    readable: true
    writable: false
    type: float
    unit: "%"
    description: Used space on `disk_path`, percent.
  - key: disk_read_rate
    readable: true
    writable: false
    type: float
    unit: "B/s"
    description: Disk read throughput since last poll, bytes/second.
  - key: disk_write_rate
    readable: true
    writable: false
    type: float
    unit: "B/s"
    description: Disk write throughput since last poll, bytes/second.
  - key: cpu_temperature
    readable: true
    writable: false
    type: float
    unit: "°C"
    description: >
      CPU temperature. On Linux via psutil.sensors_temperatures(); on Windows
      via OpenHardwareMonitor WMI (requires OpenHardwareMonitor or
      LibreHardwareMonitor running with admin rights).
  - key: uptime_seconds
    readable: true
    writable: false
    type: float
    unit: s
    description: Seconds since the machine last booted.
