description: >
  One physical Z-Wave node's values, on a Razberry/zWay Z-Wave controller,
  read/written through the thc_zWay.js helper script
  (https://github.com/Drolla/thc/tree/master/modules/thc_zWay) installed on
  the zWay server itself -- install it there yourself, PHC does not push it.
  Define whatever endpoints one node needs (e.g. a switch's `state`, a
  sensor's `battery`); every endpoint must set its own `parameters`:
  `command_group` (one of SwitchBinary, SwitchMultilevel, SwitchMultiBinary,
  SensorBinary, SensorMultilevel, Battery, TagReader) and `address` (an
  opaque zWay "node.instance[.datarecord]" identifier string, e.g. "20.1" or
  "11.0.1" -- passed through verbatim, never parsed by PHC). A TagReader
  endpoint additionally needs `node_id`, used for a one-time setup call
  before its readings are meaningful. Devices sharing one `base_url` share
  one cached batched status request per `cache_time` -- see `cache_time`
  below.

  endpoint_profiles/device_profiles below are an optional shortcut for the
  common case where one node's endpoints all derive from the same node
  number (e.g. node 11's temperature is "11.0.1", its humidity "11.0.5",
  its battery "11") -- set `node:` in the device's `params` and `profile:`
  on the device (or on one endpoint) instead of writing each `address` out
  by hand. Writing endpoints fully explicitly, without `profile:` anywhere,
  keeps working exactly as before; the two styles can also mix on one
  device (e.g. a device profile for temp/humidity/battery, plus one
  fully-explicit endpoint for something the library doesn't cover).

update: "1m"

parameters:
  - name: base_url
    override: required
    description: >
      The zWay controller's URL, e.g. "http://192.168.1.21:8083". Every
      device on the same controller should use the same base_url -- their
      status reads then automatically batch into a single combined request
      (see cache_time below). Typically set once for every device of this
      module under the top-level modules.zway.params, rather than repeated
      per device.
  - name: user
    override: allowed
    default: null
    description: >
      Login username, required by zWay >= 2.1.1. Omit (leave null) for a
      zWay server that doesn't require authentication.
  - name: password
    override: allowed
    default: null
    description: Login password, paired with `user`.
  - name: cache_time
    override: allowed
    default: "30s"
    description: >
      How long a fetched batched status response may be reused before
      re-fetching (e.g. "30s", "1m" -- any value parse_duration accepts).
      All devices sharing the same base_url share one cached fetch covering
      every registered device's values in one HTTP request, so this is the
      old THC zWay module's per-poll batching equivalent. Set the same
      value (and the same `update` interval) on every device behind one
      controller to get full sharing.
  - name: request_timeout
    override: allowed
    default: "10s"
    description: How long to wait for one HTTP request to the controller.
  - name: node
    override: allowed
    default: null
    description: >
      This node's zWay node number (e.g. 11), used only to fill in
      `{node}` templates in endpoint_profiles/device_profiles below --
      PHC never uses it for anything else. Irrelevant for a device that
      writes its endpoints' `address`es out fully explicitly.

endpoints: []

# A profile entry is a full endpoint spec, the same shape written by hand
# (see the description above), with `{node}` templates in `parameters:`
# values filled in from the device's own `node` param. `switch` carries no
# address -- a switch's channel (e.g. the ".1" in "7.1") has no safe
# default (channel 0 is real, so it can't be inferred from an unset
# param), so a device using it must still supply its own
# `parameters: { address: "7.1" }`.
endpoint_profiles:
  temperature:
    type: float
    unit: "°C"
    parameters: { command_group: SensorMultilevel, address: "{node}.0.1" }
  humidity:
    type: float
    unit: "%"
    parameters: { command_group: SensorMultilevel, address: "{node}.0.5" }
  battery:
    type: int
    unit: "%"
    parameters: { command_group: Battery, address: "{node}" }
  motion:
    type: int
    values: { 0: "clear", 1: "motion" }
    parameters: { command_group: SensorBinary, address: "{node}" }
  switch:
    type: int
    writable: true
    values: { 0: "off", 255: "on" }
    parameters: { command_group: SwitchBinary }

# A device_profiles entry is a named list of {key, profile} pairs -- set
# `profile: <name>` on a device (alongside `params: { node: ... }`) to get
# all of them at once; the device's own `endpoints:` can still tweak or add
# to what the profile provides (overlaid by key -- see
# core.config._expand_endpoint_specs).
device_profiles:
  multisensor_th:
    - { key: temp, profile: temperature }
    - { key: hum, profile: humidity }
    - { key: battery, profile: battery }
  multisensor_t:
    - { key: temp, profile: temperature }
    - { key: battery, profile: battery }
  motion_sensor:
    - { key: state, profile: motion }
    - { key: battery, profile: battery }
