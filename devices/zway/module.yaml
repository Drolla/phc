description: >
  One physical Z-Wave node's values on a Razberry/zWay controller,
  read/written via zWay.js (installed on the zWay server, not pushed by PHC).
  Define endpoints with `command_group` (SwitchBinary, SwitchMultilevel,
  SwitchMultiBinary, SensorBinary, SensorMultilevel, Battery, TagReader) and
  `address` (opaque "node.instance[.datarecord]" string, e.g. "20.1").
  Devices sharing `base_url` batch their reads into one HTTP request per
  `cache_time`. An endpoint can also set its own `poll_interval` (e.g. the
  `battery` profile defaults to "1h") to be re-fetched on a slower cadence
  than its siblings, instead of on every combined request.

  Use endpoint_profiles and device_profiles as a shortcut instead of
  hand-writing every endpoint. An endpoint_profile (e.g. `switch_binary`,
  `sensor_multilevel_temperature`) defines the access pattern (type, units,
  writability) shared across all products using that command group. A
  device_profile names one product (brand/type/product metadata) and lists
  that product's endpoints with their addresses (since the same command
  group wires differently on different hardware: an FGS222's relays are
  "{node}.1"/"{node}.2", a siren's channel is "{node}.0"). Set `node:` in
  device params and `device_profile:` on the device; `{node}` templates are
  resolved automatically. Fully-explicit endpoint specs and profiles can mix
  on one device.

update: "1m"

parameters:
  - name: base_url
    override: required
    description: >
      The zWay controller's URL, e.g. "http://192.168.1.21:8083". Every
      device on the same controller should use the same base_url -- their
      status reads then automatically batch into a single combined request
      (see cache_time below). Typically set once for every device of this
      module under the top-level modules.zway.params, rather than repeated
      per device.
  - name: user
    override: allowed
    default: null
    description: >
      Login username, required by zWay >= 2.1.1. Omit (leave null) for a
      zWay server that doesn't require authentication.
  - name: password
    override: allowed
    default: null
    description: Login password, paired with `user`.
  - name: cache_time
    override: allowed
    default: "30s"
    description: >
      How long a fetched batched status response may be reused before
      re-fetching (e.g. "30s", "1m" -- any value parse_duration accepts).
      All devices sharing base_url share one cached fetch per poll. Set the
      same value and `update` interval on every device behind one controller
      to maximize batching into a single HTTP request.
  - name: request_timeout
    override: allowed
    default: "10s"
    description: How long to wait for one HTTP request to the controller.
  - name: node
    override: allowed
    default: null
    description: >
      This node's zWay node number (e.g. 11) -- fills in `{node}` templates
      in endpoint_profiles/device_profiles below, and is also the argument
      to the one-time Configure_TagReader(node) call a TagReader endpoint
      needs before its readings are meaningful. Irrelevant for a device
      that writes its endpoints' `address`es out fully explicitly and has
      no TagReader endpoint.

endpoint_parameters:
  - name: command_group
    description: >
      SwitchBinary, SwitchMultilevel, SwitchMultiBinary, SensorBinary,
      SensorMultilevel, Battery, or TagReader.
  - name: address
    description: >
      Opaque zWay "node.instance[.datarecord]" identifier, passed through
      verbatim.
  - name: poll_interval
    description: >
      Optional minimum time between re-fetches of this endpoint (e.g.
      "1h" -- any value parse_duration accepts). Unset (the default) means
      it's fetched on every combined request alongside its sibling
      endpoints, at the device's own `update`/`cache_time` cadence. Useful
      for values that change slowly, such as battery levels, so they don't
      ride along on a fast-changing sibling's poll cadence and generate
      needless traffic to the zWay controller.

endpoints: []

endpoint_profiles:
  switch_binary:
    type: int
    writable: true
    values: { 0: "off", 255: "on" }
    command_group: SwitchBinary
  switch_multilevel:
    type: int
    writable: true
    min: 0
    max: 99
    command_group: SwitchMultilevel
  sensor_binary:
    type: int
    values: { 0: "clear", 1: "triggered" }
    command_group: SensorBinary
  battery:
    type: int
    unit: "%"
    command_group: Battery
    poll_interval: "1h"
  tag_reader:
    type: str
    command_group: TagReader
  sensor_multilevel_temperature:
    type: float
    unit: "°C"
    command_group: SensorMultilevel
  sensor_multilevel_humidity:
    type: float
    unit: "%"
    command_group: SensorMultilevel
  sensor_multilevel_luminance:
    type: float
    unit: "%"
    command_group: SensorMultilevel
  sensor_multilevel_pressure:
    type: float
    unit: kPa
    command_group: SensorMultilevel
  sensor_multilevel_dew_point:
    type: float
    unit: "°C"
    command_group: SensorMultilevel
  sensor_multilevel_wind_velocity:
    type: float
    unit: m/s
    command_group: SensorMultilevel
  sensor_multilevel_radiation:
    type: float
    command_group: SensorMultilevel
# Endpoint_profiles that are not (yet) enabled by thc_zway.tcl:
#  meter_power:
#    type: float
#    unit: W
#    command_group: Meter
#  meter_energy:
#    type: float
#    unit: kWh
#    command_group: Meter

device_profiles:
  fibaro-fgs222:
    brand: Fibaro
    type: Binary Power Switch
    product: FGS222
    description: >
      Double Relay Switch FGS-222 (2x1.5kW), with per-channel power (W) and
      cumulative energy (kWh) metering.
    endpoints:
      - { key: sw1, endpoint_profile: switch_binary, address: "{node}.1" }
      - { key: sw2, endpoint_profile: switch_binary, address: "{node}.2" }
# Endpoint_profiles that are not (yet) enabled by thc_zway.tcl:
#      - { key: power1, endpoint_profile: meter_power, address: "{node}.1.2" }
#      - { key: energy1, endpoint_profile: meter_energy, address: "{node}.1.0" }
#      - { key: power2, endpoint_profile: meter_power, address: "{node}.2.2" }
#      - { key: energy2, endpoint_profile: meter_energy, address: "{node}.2.0" }

  hsm02-hsm02:
    brand: HSM02
    type: Routing Binary Sensor
    product: HSM02
    description: Door Window Sensor
    endpoints:
      - { key: state, endpoint_profile: sensor_binary, address: "{node}.1",
          values: { 0: "closed", 1: "open" } }
      - { key: battery, endpoint_profile: battery, address: "{node}" }

  duwi:
    brand: duwi
    type: Binary Power Switch
    product: Insert switch
    description: One paddle wall switch
    endpoints:
      - { key: sw, endpoint_profile: switch_binary, address: "{node}.1" }

  everspring-st814:
    brand: Everspring
    type: Routing Multilevel Sensor
    product: ST814
    description: Temperature/Humidity Sensor
    endpoints:
      - { key: temp, endpoint_profile: sensor_multilevel_temperature, address: "{node}.0.1" }
      - { key: hum, endpoint_profile: sensor_multilevel_humidity, address: "{node}.0.5" }
      - { key: battery, endpoint_profile: battery, address: "{node}" }

  popp-z-weather:
    brand: POPP/Stagetronics
    type: Routing Multilevel Sensor
    product: Z-Weather
    description: Weather station
    endpoints:
      - { key: temp, endpoint_profile: sensor_multilevel_temperature, address: "{node}.0.1" }
      - { key: hum, endpoint_profile: sensor_multilevel_humidity, address: "{node}.0.5" }
      - { key: lum, endpoint_profile: sensor_multilevel_luminance, address: "{node}.0.3" }
      - { key: pres, endpoint_profile: sensor_multilevel_pressure, address: "{node}.0.9" }
      - { key: dew, endpoint_profile: sensor_multilevel_dew_point, address: "{node}.0.11" }
      - { key: vel, endpoint_profile: sensor_multilevel_wind_velocity, address: "{node}.0.6" }
      - { key: battery, endpoint_profile: battery, address: "{node}" }

  everspring-siren_300_series:
    brand: Everspring
    product: Z-Wave Indoor Siren (US) 300 Series
    description: Indoor Siren (US) - 300 series
    endpoints:
      - { key: state, endpoint_profile: switch_binary, address: "{node}.0" }
      - { key: battery, endpoint_profile: battery, address: "{node}.0" }

  benext-tag_reader:
    brand: BeNeXt
    type: Tag Reader
    description: Tag Reader
    endpoints:
      - { key: state, endpoint_profile: tag_reader, address: "{node}" }
      - { key: ack, endpoint_profile: switch_binary, address: "{node}" }
      - { key: battery, endpoint_profile: battery, address: "{node}" }

  everspring-pir_sensor:
    brand: Everspring
    type: Routing Binary Sensor
    product: Z-Wave PIR Sensor(US)-300 Series
    description: Motion Detector with Light Detection
    endpoints:
      - { key: state, endpoint_profile: sensor_binary, address: "{node}",
          values: { 0: "clear", 1: "motion" } }
      - { key: battery, endpoint_profile: battery, address: "{node}" }

  rm80-radiation_monitor:
    product: RM-80
    description: Radiation monitor
    endpoints:
      - { key: radiation, endpoint_profile: sensor_multilevel_radiation, address: "{node}.2.2" }
